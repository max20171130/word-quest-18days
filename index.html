<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>单词闯关 - 初一暑假英语</title>
<style>
  :root {
    --bg: #F4F7FB;
    --card: #FFFFFF;
    --primary: #3E63DD;
    --primary-dark: #2C49B4;
    --success: #23A566;
    --success-bg: #E4F8EE;
    --danger: #E5484D;
    --danger-bg: #FDECEC;
    --gold: #F5A623;
    --text: #1F2937;
    --text-dim: #6B7280;
    --locked: #C7CDD6;
    --radius: 18px;
    --shadow: 0 6px 18px rgba(31,41,55,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    overscroll-behavior: none;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }

  /* ---------- Header / stats bar ---------- */
  .statbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px calc(10px + env(safe-area-inset-top)) 16px;
    padding-top: max(14px, env(safe-area-inset-top));
    background: var(--card);
    box-shadow: var(--shadow);
    position: sticky; top: 0; z-index: 20;
  }
  .stat { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 15px; }
  .stat .emoji { font-size: 18px; }
  .brand { font-size: 17px; font-weight: 800; color: var(--primary-dark); }

  /* ---------- Map screen ---------- */
  .map-wrap { flex: 1; padding: 20px 16px 40px; overflow-y: auto; }
  .map-title { text-align: center; margin: 4px 0 22px; }
  .map-title h1 { font-size: 20px; margin: 0 0 4px; }
  .map-title p { font-size: 13px; color: var(--text-dim); margin: 0; }

  .path { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .node-row { display: flex; align-items: center; width: 100%; justify-content: center; }
  .node {
    width: 76px; height: 76px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--primary); color: #fff; font-weight: 800; font-size: 14px;
    box-shadow: 0 6px 0 var(--primary-dark);
    border: none; cursor: pointer; position: relative;
    transition: transform .08s ease;
  }
  .node:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--primary-dark); }
  .node.locked { background: var(--locked); box-shadow: 0 6px 0 #A7AEB9; cursor: default; }
  .node.locked:active { transform: none; box-shadow: 0 6px 0 #A7AEB9; }
  .node.review { background: var(--gold); box-shadow: 0 6px 0 #C97F0E; }
  .node.review:active { box-shadow: 0 2px 0 #C97F0E; }
  .node .daylabel { font-size: 11px; opacity: .85; }
  .node .daynum { font-size: 20px; }
  .node .stars { position: absolute; bottom: -14px; font-size: 13px; letter-spacing: 1px; }
  .node-side-label { font-size: 12px; color: var(--text-dim); max-width: 90px; text-align: center; line-height: 1.3; }
  .connector { width: 4px; height: 20px; background: #D7DEE8; border-radius: 2px; }

  .free-review-btn {
    margin: 26px auto 0; display: block; width: fit-content;
    background: var(--card); border: 2px solid var(--primary); color: var(--primary-dark);
    font-weight: 700; font-size: 14px; padding: 12px 22px; border-radius: 999px;
    box-shadow: var(--shadow);
  }

  /* ---------- Lesson screen ---------- */
  .lesson-wrap { flex: 1; display: flex; flex-direction: column; padding: 12px 16px 24px; }
  .lesson-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .close-btn { font-size: 22px; color: var(--text-dim); background: none; border: none; padding: 4px 8px; cursor: pointer; }
  .progressbar-track { flex: 1; height: 14px; background: #E5E9F0; border-radius: 999px; overflow: hidden; }
  .progressbar-fill { height: 100%; background: var(--success); border-radius: 999px; transition: width .3s ease; }
  .hearts { display: flex; gap: 3px; font-size: 17px; min-width: 76px; justify-content: flex-end; }

  .question-card { flex: 1; display: flex; flex-direction: column; }
  .q-instruction { font-size: 14px; color: var(--text-dim); font-weight: 700; margin-bottom: 10px; }
  .q-prompt {
    background: var(--card); border-radius: var(--radius); padding: 22px 18px;
    box-shadow: var(--shadow); margin-bottom: 18px; text-align: center;
  }
  .q-prompt .word { font-size: 30px; font-weight: 800; color: var(--primary-dark); }
  .q-prompt .ipa { font-size: 16px; color: var(--text-dim); margin-top: 4px; font-style: italic; }
  .q-prompt .pos { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
  .q-prompt .cn { font-size: 26px; font-weight: 800; }
  .q-prompt .sentence { font-size: 16px; line-height: 1.6; margin-top: 6px; }
  .q-prompt .sentence .blank { display: inline-block; min-width: 60px; border-bottom: 2px solid var(--primary); color: var(--primary-dark); font-weight: 800; }
  .q-prompt .sentence-zh { font-size: 13px; color: var(--text-dim); margin-top: 6px; }
  .speak-btn {
    margin-top: 10px; background: var(--primary); color: #fff; border: none;
    width: 46px; height: 46px; border-radius: 50%; font-size: 20px; box-shadow: 0 4px 0 var(--primary-dark);
  }
  .speak-btn:active { transform: translateY(3px); box-shadow: none; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: var(--card); border: 2px solid #E1E6EE; border-radius: 14px;
    padding: 14px 16px; font-size: 17px; font-weight: 700; text-align: left;
    color: var(--text); cursor: pointer;
  }
  .option-btn:active { background: #EEF1F7; }
  .option-btn.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); }
  .option-btn.wrong { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
  .option-btn.dim { opacity: .5; }

  .spell-row { display: flex; gap: 10px; margin-top: 4px; }
  .spell-input {
    flex: 1; font-size: 20px; padding: 14px 16px; border-radius: 14px;
    border: 2px solid #E1E6EE; font-weight: 700; color: var(--text);
  }
  .spell-input.correct { border-color: var(--success); background: var(--success-bg); color: var(--success); }
  .spell-input.wrong { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
  .hint-btn { background: #EEF1F7; border: none; border-radius: 14px; padding: 0 16px; font-weight: 700; color: var(--text-dim); font-size: 14px; }

  .feedback-bar {
    position: sticky; bottom: 0; left: 0; right: 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    margin: 16px -16px -24px; border-radius: 18px 18px 0 0;
  }
  .feedback-bar.correct { background: var(--success-bg); }
  .feedback-bar.wrong { background: var(--danger-bg); }
  .feedback-text { font-weight: 800; font-size: 16px; margin-bottom: 4px; }
  .feedback-bar.correct .feedback-text { color: var(--success); }
  .feedback-bar.wrong .feedback-text { color: var(--danger); }
  .feedback-answer { font-size: 14px; color: var(--text-dim); margin-bottom: 10px; }
  .btn-primary {
    width: 100%; padding: 15px; border: none; border-radius: 14px; font-size: 17px; font-weight: 800;
    color: #fff; background: var(--primary); box-shadow: 0 4px 0 var(--primary-dark);
  }
  .btn-primary:active { transform: translateY(3px); box-shadow: none; }
  .feedback-bar.wrong .btn-primary { background: var(--danger); box-shadow: 0 4px 0 #B23238; }

  .check-btn {
    width: 100%; padding: 15px; border: none; border-radius: 14px; font-size: 17px; font-weight: 800;
    color: #fff; background: var(--locked); box-shadow: 0 4px 0 #A7AEB9; margin-top: 16px;
  }
  .check-btn.active { background: var(--success); box-shadow: 0 4px 0 #17824B; }

  /* ---------- Summary screen ---------- */
  .summary-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; text-align: center; }
  .summary-emoji { font-size: 58px; margin-bottom: 8px; }
  .summary-title { font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  .summary-sub { font-size: 14px; color: var(--text-dim); margin-bottom: 20px; }
  .summary-stars { font-size: 34px; letter-spacing: 6px; margin-bottom: 18px; }
  .summary-stats { display: flex; gap: 14px; margin-bottom: 26px; width: 100%; max-width: 320px; }
  .summary-stat-card { flex: 1; background: var(--card); border-radius: 14px; padding: 14px 8px; box-shadow: var(--shadow); }
  .summary-stat-card .num { font-size: 20px; font-weight: 800; color: var(--primary-dark); }
  .summary-stat-card .label { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .miss-list { width: 100%; max-width: 340px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; margin-bottom: 22px; text-align: left; }
  .miss-list h3 { font-size: 14px; margin: 0 0 8px; color: var(--text-dim); }
  .miss-item { font-size: 15px; padding: 6px 0; border-bottom: 1px solid #EEF1F7; display: flex; justify-content: space-between; }
  .miss-item:last-child { border-bottom: none; }
  .miss-item .w { font-weight: 700; }
  .miss-item .c { color: var(--text-dim); }
  .summary-actions { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
  .btn-secondary {
    width: 100%; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 700;
    background: var(--card); color: var(--primary-dark); border: 2px solid var(--primary);
  }

  /* ---------- Study screen (learn before test) ---------- */
  .study-wrap { flex: 1; display: flex; flex-direction: column; padding: 12px 16px 24px; }
  .study-topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .study-progress-text { font-size: 13px; color: var(--text-dim); font-weight: 700; }
  .study-mode-badge { font-size: 12px; font-weight: 700; color: #fff; background: var(--primary); padding: 4px 10px; border-radius: 999px; }
  .study-mode-badge.recall { background: var(--gold); }
  .study-card {
    flex: 1; min-height: 260px; background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 26px 20px; margin-bottom: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    cursor: pointer;
  }
  .study-flip-hint { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
  .study-word { font-size: 34px; font-weight: 800; color: var(--primary-dark); }
  .study-pos { font-size: 13px; color: var(--text-dim); margin-top: 6px; }
  .study-ipa { font-size: 17px; color: var(--text-dim); font-style: italic; margin-top: 4px; }
  .study-cn { font-size: 28px; font-weight: 800; margin-bottom: 14px; }
  .study-sentence { font-size: 16px; line-height: 1.7; }
  .study-sentence b { color: var(--primary-dark); }
  .study-sentence .blank { color: var(--primary-dark); font-weight: 800; }
  .study-sentence-zh { font-size: 13px; color: var(--text-dim); margin-top: 8px; }
  .study-card .speak-btn { margin-top: 16px; }
  .study-nav { display: flex; align-items: center; gap: 10px; }
  .study-nav .btn-secondary, .study-nav .btn-primary { flex: 1; margin: 0; }
  .study-nav .nav-icon-btn {
    width: 48px; height: 48px; flex: none; border-radius: 14px; border: 2px solid #E1E6EE;
    background: var(--card); font-size: 18px; color: var(--text-dim);
  }
  .study-nav .nav-icon-btn:disabled { opacity: .35; }

  .recall-card {
    flex: 1; min-height: 260px; background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 26px 20px; margin-bottom: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .recall-hint { font-size: 14px; color: var(--text-dim); margin-top: 14px; }
  .recall-mark-row { display: flex; gap: 10px; }
  .recall-mark-row button { flex: 1; margin: 0; }
  .recall-known-btn { background: var(--success) !important; box-shadow: 0 4px 0 #17824B !important; }

  .hidden { display: none !important; }

  .streak-toast {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 700; z-index: 100; box-shadow: 0 6px 16px rgba(0,0,0,.2);
    opacity: 0; transition: opacity .3s ease, top .3s ease;
    pointer-events: none;
  }
  .streak-toast.show { opacity: 1; top: 20px; }

  .storage-warning {
    font-size: 11px; color: var(--text-dim); text-align: center; padding: 6px 16px 0;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const WORDS = [{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"accept","pos":"v.","cn":"接受","ipa":"əkˈsɛpt","en":"I {{accept}} your invitation to the party.","zh":"我接受你的派对邀请。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"appear","pos":"v.","cn":"出现；似乎","ipa":"əˈpɪr","en":"The stars {{appear}} in the sky after sunset.","zh":"太阳落山后星星就出现在天空中。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"continue","pos":"v.","cn":"继续","ipa":"kənˈtɪnju","en":"Please {{continue}} reading the next chapter.","zh":"请继续读下一章。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"decide","pos":"v.","cn":"决定","ipa":"ˌdɪˈsaɪd","en":"We need to {{decide}} where to go this weekend.","zh":"我们需要决定这个周末去哪里。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"discover","pos":"v.","cn":"发现","ipa":"dɪˈskəvər","en":"Scientists {{discovered}} a new planet last year.","zh":"科学家去年发现了一颗新行星。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"expect","pos":"v.","cn":"期待，预料","ipa":"ɪkˈspɛkt","en":"I {{expect}} to finish my homework before dinner.","zh":"我预计晚饭前能做完作业。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"prepare","pos":"v.","cn":"准备","ipa":"priˈpɛr","en":"She is {{preparing}} for her English exam.","zh":"她正在为英语考试做准备。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"protect","pos":"v.","cn":"保护","ipa":"prəˈtɛkt","en":"Wearing a helmet can {{protect}} your head.","zh":"戴头盔可以保护你的头部。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"produce","pos":"v.","cn":"生产；产生","ipa":"ˈproʊdus","en":"This factory {{produces}} thousands of toys every day.","zh":"这家工厂每天生产成千上万个玩具。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"provide","pos":"v.","cn":"提供","ipa":"prəˈvaɪd","en":"The school will {{provide}} lunch for all students.","zh":"学校将为所有学生提供午餐。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"receive","pos":"v.","cn":"收到","ipa":"rɪˈsiv","en":"I {{received}} a nice birthday gift from my aunt.","zh":"我收到了姑姑送的很棒的生日礼物。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"recognize","pos":"v.","cn":"认出；承认","ipa":"ˈrɛkəgˌnaɪz","en":"I didn't {{recognize}} him with his new haircut.","zh":"他剪了新发型,我都认不出他了。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"remain","pos":"v.","cn":"保持；剩下","ipa":"rɪˈmeɪn","en":"Only a few seats {{remain}} for the concert.","zh":"音乐会只剩下几个座位了。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"require","pos":"v.","cn":"需要，要求","ipa":"ˌrikˈwaɪər","en":"This job {{requires}} good communication skills.","zh":"这份工作需要良好的沟通能力。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"suggest","pos":"v.","cn":"建议","ipa":"səˈʤɛst","en":"My teacher {{suggested}} that I read more books.","zh":"我的老师建议我多读书。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"suppose","pos":"v.","cn":"猜想，假设","ipa":"səˈpoʊz","en":"I {{suppose}} it will rain tomorrow.","zh":"我猜明天会下雨。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"realize","pos":"v.","cn":"意识到","ipa":"ˈriəˌlaɪz","en":"I didn't {{realize}} how late it was.","zh":"我没意识到已经这么晚了。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"seem","pos":"v.","cn":"似乎","ipa":"sim","en":"She {{seems}} very happy today.","zh":"她今天看起来很开心。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"succeed","pos":"v.","cn":"成功","ipa":"səkˈsid","en":"He worked hard and finally {{succeeded}}.","zh":"他努力工作,最终成功了。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"support","pos":"v.","cn":"支持","ipa":"səˈpɔrt","en":"My parents always {{support}} my dreams.","zh":"我父母一直支持我的梦想。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"mention","pos":"v.","cn":"提到","ipa":"ˈmɛnʃən","en":"She didn't {{mention}} the meeting time.","zh":"她没有提到会议时间。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"offer","pos":"v.","cn":"提供，主动提出","ipa":"ˈɔfər","en":"My friend {{offered}} to help me with math.","zh":"我朋友主动提出帮我学数学。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"promise","pos":"v./n.","cn":"承诺","ipa":"ˈprɑməs","en":"I {{promise}} to call you tonight.","zh":"我保证今晚给你打电话。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"refuse","pos":"v.","cn":"拒绝","ipa":"ˈrɛfˌjuz","en":"He {{refused}} to give up on his dream.","zh":"他拒绝放弃自己的梦想。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"remind","pos":"v.","cn":"提醒","ipa":"riˈmaɪnd","en":"Please {{remind}} me to bring my umbrella.","zh":"请提醒我带伞。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"remove","pos":"v.","cn":"移除","ipa":"riˈmuv","en":"Please {{remove}} your shoes before entering.","zh":"进门前请脱鞋。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"repair","pos":"v.","cn":"修理","ipa":"rɪˈpɛr","en":"The workers are {{repairing}} the broken road.","zh":"工人们正在修理损坏的道路。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"replace","pos":"v.","cn":"替换","ipa":"ˌriˈpleɪs","en":"We need to {{replace}} the old computer.","zh":"我们需要更换这台旧电脑。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"reply","pos":"v.","cn":"回答，回复","ipa":"rɪˈplaɪ","en":"She didn't {{reply}} to my message.","zh":"她没有回复我的消息。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"represent","pos":"v.","cn":"代表","ipa":"ˌrɛprɪˈzɛnt","en":"This flag {{represents}} our country.","zh":"这面旗帜代表我们的国家。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"request","pos":"v./n.","cn":"请求","ipa":"rɪkˈwɛst","en":"He made a {{request}} for extra time.","zh":"他请求延长时间。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"affect","pos":"v.","cn":"影响","ipa":"əˈfɛkt","en":"Lack of sleep can {{affect}} your health.","zh":"睡眠不足会影响你的健康。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"avoid","pos":"v.","cn":"避免","ipa":"əˈvɔɪd","en":"Try to {{avoid}} eating too much sugar.","zh":"尽量避免吃太多糖。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"compare","pos":"v.","cn":"比较","ipa":"kəmˈpɛr","en":"Let's {{compare}} the two plans before deciding.","zh":"我们决定之前先比较一下这两个方案。"},{"day":1,"theme":"高频动词（日常动作/沟通类）","word":"complain","pos":"v.","cn":"抱怨","ipa":"kəmˈpleɪn","en":"Stop {{complaining}} about the weather.","zh":"别再抱怨天气了。"},{"day":2,"theme":"高频动词（情感/交流类）","word":"agree","pos":"v.","cn":"同意","ipa":"əˈgri","en":"I {{agree}} with your opinion.","zh":"我同意你的观点。"},{"day":2,"theme":"高频动词（情感/交流类）","word":"admit","pos":"v.","cn":"承认","ipa":"ədˈmɪt","en":"He {{admitted}} that he made a mistake.","zh":"他承认自己犯了错误。"},{"day":2,"theme":"高频动词（情感/交流类）","word":"allow","pos":"v.","cn":"允许","ipa":"əˈlaʊ", althy","pos":"adj.","cn":"健康的","ipa":"ˈhɛlθi","en":"Try to eat {{healthy}} food every day.","zh":"尽量每天吃健康的食物。"},{"day":14,"theme":"高频词汇（健康/生活类）","word":"unhealthy","pos":"adj.","cn":"不健康的","ipa":"ənˈhɛlθi","en":"Eating too much fast food is {{unhealthy}}.","zh":"吃太多快餐是不健康的。"},{"day":14,"theme":"高频词汇（健康/生活类）","word":"chronic","pos":"adj.","cn":"慢性的","ipa":"ˈkrɑnɪk","en":"He has suffered from a {{chronic}} illness for years.","zh":"他多年来一直患有慢性病。"},{"day":14,"theme":"高频词汇（健康/生活类）","word":"physical","pos":"adj.","cn":"身体的","ipa":"ˈfɪzɪkəl","en":"{{Physical}} exercise is important for both body and mind.","zh":"体育锻炼对身心都很重要。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"global","pos":"adj.","cn":"全球的","ipa":"ˈgloʊbəl","en":"Climate change is a {{global}} problem.","zh":"气候变化是一个全球性问题。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"local","pos":"adj.","cn":"当地的","ipa":"ˈloʊkəl","en":"We bought vegetables from a {{local}} farmer.","zh":"我们从当地农民那里买了蔬菜。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"international","pos":"adj.","cn":"国际的","ipa":"ˌɪnərˈnæʃənɑl","en":"She wants to work for an {{international}} company.","zh":"她想为一家跨国公司工作。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"domestic","pos":"adj.","cn":"国内的；家庭的","ipa":"dəˈmɛstɪk","en":"The airport has both {{domestic}} and international flights.","zh":"这座机场既有国内航班也有国际航班。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"cultural","pos":"adj.","cn":"文化的","ipa":"ˈkəlʧərəl","en":"The festival celebrates our {{cultural}} traditions.","zh":"这个节日庆祝我们的文化传统。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"historical","pos":"adj.","cn":"历史的","ipa":"hɪˈstɔrɪkəl","en":"The city is full of {{historical}} buildings.","zh":"这座城市有很多历史建筑。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"traditional","pos":"adj.","cn":"传统的","ipa":"trəˈdɪʃənəl","en":"We wore {{traditional}} clothes for the festival.","zh":"我们在节日期间穿上了传统服装。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"modern","pos":"adj.","cn":"现代的","ipa":"ˈmɑdərn","en":"This museum has a very {{modern}} design.","zh":"这座博物馆的设计非常现代。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"ancient","pos":"adj.","cn":"古代的","ipa":"ˈeɪnʧənt","en":"We visited an {{ancient}} temple during our trip.","zh":"我们在旅行中参观了一座古代寺庙。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"classic","pos":"adj.","cn":"经典的","ipa":"ˈklæsɪk","en":"This is a {{classic}} example of a fairy tale.","zh":"这是童话故事的一个经典例子。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"contemporary","pos":"adj.","cn":"当代的","ipa":"kənˈtɛmpərˌɛri","en":"The gallery shows {{contemporary}} art from young artists.","zh":"这家画廊展出年轻艺术家的当代艺术作品。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"popular","pos":"adj.","cn":"受欢迎的","ipa":"ˈpɑpjələr","en":"K-pop music is very {{popular}} among teenagers.","zh":"韩流音乐在青少年中非常流行。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"famous","pos":"adj.","cn":"著名的","ipa":"ˈfeɪməs","en":"This restaurant is {{famous}} for its noodles.","zh":"这家餐厅以面条闻名。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"wealthy","pos":"adj.","cn":"富有的","ipa":"ˈwɛlθi","en":"The {{wealthy}} businessman donated money to the school.","zh":"这位富有的商人向学校捐了款。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"poor","pos":"adj.","cn":"贫穷的","ipa":"pur","en":"The charity helps {{poor}} families in the countryside.","zh":"这家慈善机构帮助乡村的贫困家庭。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"rich","pos":"adj.","cn":"富有的","ipa":"rɪʧ","en":"The soil here is {{rich}} and good for farming.","zh":"这里的土壤肥沃,适合耕种。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"developed","pos":"adj.","cn":"发达的","ipa":"dɪˈvɛləpt","en":"Japan is considered a {{developed}} country.","zh":"日本被认为是一个发达国家。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"developing","pos":"adj.","cn":"发展中的","ipa":"dɪˈvɛləpɪŋ","en":"Many {{developing}} countries are building new schools.","zh":"许多发展中国家正在建设新学校。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"advanced","pos":"adj.","cn":"先进的","ipa":"ədˈvænst","en":"This is an {{advanced}} class for students who already know the basics.","zh":"这是为已经掌握基础知识的学生开设的高级班。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"basic","pos":"adj.","cn":"基本的","ipa":"ˈbeɪsɪk","en":"Everyone should learn some {{basic}} first-aid skills.","zh":"每个人都应该学习一些基本的急救技能。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"fundamental","pos":"adj.","cn":"基础的，根本的","ipa":"ˌfəndəˈmɛnəl","en":"Honesty is a {{fundamental}} value in our family.","zh":"诚实是我们家庭的一项基本价值观。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"primary","pos":"adj.","cn":"主要的；初级的","ipa":"ˈpraɪˌmɛri","en":"Reading is the {{primary}} goal of this class.","zh":"阅读是这门课的主要目标。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"secondary","pos":"adj.","cn":"次要的；中等的","ipa":"ˈsɛkənˌdɛri","en":"He will go to a {{secondary}} school next year.","zh":"他明年将上中学。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"initial","pos":"adj.","cn":"最初的","ipa":"ˌɪˈnɪʃəl","en":"My {{initial}} plan was to travel by train.","zh":"我最初的计划是坐火车旅行。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"final","pos":"adj.","cn":"最后的","ipa":"ˈfaɪnəl","en":"This is the {{final}} question on the test.","zh":"这是这次测试的最后一道题。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"ultimate","pos":"adj.","cn":"最终的","ipa":"ˈəltəmət","en":"Winning the championship was her {{ultimate}} goal.","zh":"赢得冠军是她的终极目标。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"overall","pos":"adj.","cn":"总体的","ipa":"ˈoʊvərˌɔl","en":"The {{overall}} quality of the show was excellent.","zh":"这场演出的整体质量非常出色。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"entire","pos":"adj.","cn":"整个的","ipa":"ɪnˈtaɪər","en":"She spent the {{entire}} weekend studying for the exam.","zh":"她花了整个周末的时间备考。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"whole","pos":"adj.","cn":"整个的","ipa":"hoʊl","en":"He ate the {{whole}} cake by himself.","zh":"他一个人吃掉了整个蛋糕。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"partial","pos":"adj.","cn":"部分的","ipa":"ˈpɑrʃəl","en":"We only got a {{partial}} refund for the trip.","zh":"我们只拿到了这次旅行的部分退款。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"minor","pos":"adj.","cn":"较小的","ipa":"ˈmaɪnər","en":"It was just a {{minor}} mistake, nothing serious.","zh":"这只是个小错误,没什么大不了的。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"major","pos":"adj.","cn":"主要的","ipa":"ˈmeɪʤər","en":"Pollution is a {{major}} problem in many cities.","zh":"污染在许多城市是一个主要问题。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"average","pos":"adj./n.","cn":"平均的；平均数","ipa":"ˈævərɪʤ","en":"The {{average}} temperature in summer is around 30 degrees.","zh":"夏天的平均气温大约是30度。"},{"day":15,"theme":"高频形容词（综合补充类）","word":"extra","pos":"adj.","cn":"额外的","ipa":"ˈɛkstrə","en":"Can I have some {{extra}} time to finish the test?","zh":"我可以多要一点时间做完测试吗?"},{"day":15,"theme":"高频形容词（综合补充类）","word":"additional","pos":"adj.","cn":"附加的","ipa":"əˈdɪʃənəl","en":"The teacher gave us {{additional}} practice sheets.","zh":"老师给了我们额外的练习题。"}];
</script>
<script>
(function () {
  "use strict";

  /* ================= storage ================= */
  const STORAGE_KEY = "vocabGameStateV1";
  let persistOK = true;
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { persistOK = false; }
    return null;
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { persistOK = false; }
  }

  const todayStr = () => {
    const d = new Date();
    return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
  };

  let state = loadState() || {
    xp: 0,
    streak: 0,
    lastPlayedDate: null,
    completed: {}, // { levelId: { stars, bestScore } }
    studied: {}    // { levelId: true } — has this day's word list been studied at least once
  };
  if (!state.studied) state.studied = {}; // backward-compat with saves from before this field existed

  /* ================= word pools ================= */
  const WORDS_BY_DAY = {};
  WORDS.forEach(w => {
    (WORDS_BY_DAY[w.day] = WORDS_BY_DAY[w.day] || []).push(w);
  });

  const LEVELS = [];
  for (let d = 1; d <= 15; d++) {
    LEVELS.push({ id: d, type: "learn", label: "Day " + d, sub: WORDS_BY_DAY[d][0].theme.replace(/[（）]/g, m => m==="（"?" (":")") });
  }
  LEVELS.push({ id: 16, type: "review", label: "Day 16", sub: "大滚动复习①" });
  LEVELS.push({ id: 17, type: "review", label: "Day 17", sub: "大滚动复习②" });
  LEVELS.push({ id: 18, type: "review", label: "Day 18", sub: "总测验" });

  // Ebbinghaus-curve review schedule — same day-to-day mapping used in the
  // printed word-plan doc's "复习安排" column (1-day, then widening gaps,
  // with Day6/Day12 as bigger weekly rolling reviews). Each day's quiz pulls
  // its review words specifically from these days, not a random prior day.
  const REVIEW_SCHEDULE = {
    2: { days: [1], count: 8 },
    3: { days: [1, 2], count: 8 },
    4: { days: [1, 2, 3], count: 8 },
    5: { days: [2, 4], count: 8 },
    6: { days: [1, 2, 3, 4, 5], count: 18 },       // 周复习
    7: { days: [3, 5, 6], count: 8 },
    8: { days: [4, 6, 7], count: 8 },
    9: { days: [5, 7, 8], count: 8 },
    10: { days: [6, 8, 9], count: 8 },
    11: { days: [7, 9, 10], count: 8 },
    12: { days: [6, 7, 8, 9, 10, 11], count: 18 }, // 周复习
    13: { days: [8, 10, 12], count: 8 },
    14: { days: [9, 11, 13], count: 8 },
    15: { days: [10, 12, 14], count: 8 },
  };

  function reviewLabelFor(levelId) {
    const s = REVIEW_SCHEDULE[levelId];
    if (!s) return null;
    const dayList = "Day" + s.days.join("、Day");
    return (s.days.length >= 5 ? "周复习 · " : "测试关卡混入复习 · ") + dayList;
  }

  function isUnlocked(levelId) {
    if (levelId === 1) return true;
    return !!state.completed[levelId - 1];
  }

  /* ================= helpers ================= */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function sample(arr, n) { return shuffle(arr).slice(0, Math.min(n, arr.length)); }
  function extractMarker(en) {
    const m = en.match(/\{\{(.*?)\}\}/);
    return m ? m[1] : "";
  }
  function renderSentenceHTML(en, blankText) {
    return en.replace(/\{\{(.*?)\}\}/, '<span class="blank">' + (blankText ? blankText : "____") + '</span>');
  }
  function speak(text) {
    try {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.9;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* ================= app state machine ================= */
  const app = document.getElementById("app");
  let screen = "map"; // map | study | lesson | summary
  let lessonState = null;
  let studyState = null;

  function go(newScreen) { screen = newScreen; render(); }

  /* ---------------- MAP SCREEN ---------------- */
  function buildLessonPool(level) {
    if (level.type === "learn") {
      const dayWords = shuffle(WORDS_BY_DAY[level.id]);
      let reviewWords = [];
      const schedule = REVIEW_SCHEDULE[level.id];
      if (schedule) {
        const reviewPool = [];
        schedule.days.forEach(d => reviewPool.push(...WORDS_BY_DAY[d]));
        reviewWords = sample(reviewPool, Math.min(schedule.count, reviewPool.length));
      }
      return shuffle(dayWords.concat(reviewWords));
    }
    if (level.id === 16 || level.id === 17) {
      let pool = [];
      for (let d = 1; d <= 15; d++) pool = pool.concat(WORDS_BY_DAY[d]);
      return sample(pool, 40);
    }
    // level 18 总测验
    return sample(WORDS, 60);
  }

  function statHeader() {
    const div = document.createElement("div");
    div.className = "statbar";
    div.innerHTML =
      '<div class="brand">🐣 单词闯关</div>' +
      '<div style="display:flex;gap:14px;">' +
      '<div class="stat"><span class="emoji">🔥</span>' + state.streak + '</div>' +
      '<div class="stat"><span class="emoji">⭐</span>' + state.xp + '</div>' +
      '</div>';
    return div;
  }

  function renderMap() {
    app.innerHTML = "";
    app.appendChild(statHeader());

    const wrap = document.createElement("div");
    wrap.className = "map-wrap";

    const title = document.createElement("div");
    title.className = "map-title";
    title.innerHTML = "<h1>18天单词闯关地图</h1><p>点亮的关卡可以点进去挑战，完成上一关解锁下一关</p>";
    wrap.appendChild(title);

    const path = document.createElement("div");
    path.className = "path";

    LEVELS.forEach((lv, idx) => {
      if (idx > 0) {
        const c = document.createElement("div");
        c.className = "connector";
        path.appendChild(c);
      }
      const row = document.createElement("div");
      row.className = "node-row";
      row.style.gap = "14px";

      const unlocked = isUnlocked(lv.id);
      const completedInfo = state.completed[lv.id];

      const needsStudy = lv.type === "learn" && !state.studied[lv.id];
      const node = document.createElement("button");
      node.className = "node" + (unlocked ? (lv.type === "review" ? " review" : "") : " locked");
      const dayIcon = lv.type === "review" ? "🏆" : (needsStudy ? "📖" : "📘");
      node.innerHTML =
        '<div class="daylabel">' + (unlocked ? dayIcon : "🔒") + '</div>' +
        '<div class="daynum">' + lv.id + '</div>' +
        (completedInfo ? '<div class="stars">' + "★".repeat(completedInfo.stars) + "☆".repeat(3 - completedInfo.stars) + '</div>' : '');
      if (unlocked) {
        node.addEventListener("click", () => needsStudy ? startStudy(lv) : startLesson(lv));
      }

      const sideLabel = document.createElement("div");
      sideLabel.className = "node-side-label";
      sideLabel.textContent = lv.label + " · " + lv.sub;
      const reviewLabel = reviewLabelFor(lv.id);
      if (reviewLabel) {
        const rl = document.createElement("div");
        rl.style.cssText = "font-size:10.5px;color:var(--text-dim);margin-top:2px;";
        rl.textContent = reviewLabel;
        sideLabel.appendChild(rl);
      }
      if (unlocked && needsStudy) {
        const tag = document.createElement("div");
        tag.style.cssText = "font-size:11px;color:var(--primary-dark);font-weight:700;margin-top:2px;";
        tag.textContent = "先学习再测试";
        sideLabel.appendChild(tag);
      } else if (unlocked && lv.type === "learn") {
        const restudyBtn = document.createElement("button");
        restudyBtn.textContent = "📖 复习单词";
        restudyBtn.style.cssText = "margin-top:4px;font-size:11px;font-weight:700;color:var(--primary-dark);background:none;border:1px solid var(--primary);border-radius:999px;padding:2px 8px;";
        restudyBtn.addEventListener("click", (e) => { e.stopPropagation(); startStudy(lv); });
        sideLabel.appendChild(restudyBtn);
      }

      if (idx % 2 === 0) {
        row.appendChild(node);
        row.appendChild(sideLabel);
      } else {
        row.appendChild(sideLabel);
        row.appendChild(node);
      }
      path.appendChild(row);
    });

    wrap.appendChild(path);

    if (!persistOK) {
      const warn = document.createElement("p");
      warn.className = "storage-warning";
      warn.textContent = "当前浏览器无法保存进度，关闭页面后本次记录会丢失";
      wrap.appendChild(warn);
    }

    app.appendChild(wrap);
  }

  /* ---------------- STUDY SCREEN (learn before test) ---------------- */
  function startStudy(level) {
    studyState = {
      level,
      words: shuffle(WORDS_BY_DAY[level.id]),
      phase: "browse", // browse | recall | done
      idx: 0,
      flipped: false,
      recallQueue: [],
      recallRevealed: false,
      knownCount: 0,
    };
    go("study");
  }

  function renderStudyBrowse() {
    const st = studyState;
    const word = st.words[st.idx];
    const wrap = document.createElement("div");
    wrap.className = "study-wrap";

    const topbar = document.createElement("div");
    topbar.className = "study-topbar";
    const closeBtn = document.createElement("button");
    closeBtn.className = "close-btn";
    closeBtn.textContent = "✕";
    closeBtn.addEventListener("click", () => go("map"));
    const progress = document.createElement("div");
    progress.className = "study-progress-text";
    progress.textContent = "学习 " + (st.idx + 1) + " / " + st.words.length;
    const badge = document.createElement("div");
    badge.className = "study-mode-badge";
    badge.textContent = "第一步·认识单词";
    topbar.appendChild(closeBtn);
    topbar.appendChild(progress);
    topbar.appendChild(badge);
    wrap.appendChild(topbar);

    const card = document.createElement("div");
    card.className = "study-card";
    if (!st.flipped) {
      card.innerHTML =
        '<div class="study-flip-hint">点击卡片，看中文意思和例句 👆</div>' +
        '<div class="study-word">' + word.word + '</div>' +
        '<div class="study-pos">' + word.pos + '</div>' +
        '<div class="study-ipa">/' + word.ipa + '/</div>';
      const speakBtn = document.createElement("button");
      speakBtn.className = "speak-btn";
      speakBtn.textContent = "🔊";
      speakBtn.addEventListener("click", (e) => { e.stopPropagation(); speak(word.word); });
      card.appendChild(speakBtn);
    } else {
      card.innerHTML =
        '<div class="study-flip-hint">点击卡片，翻回单词 👆</div>' +
        '<div class="study-cn">' + word.cn + '</div>' +
        '<div class="study-sentence">' + renderSentenceHTML(word.en, word.word) + '</div>' +
        '<div class="study-sentence-zh">' + word.zh + '</div>';
      const speakBtn = document.createElement("button");
      speakBtn.className = "speak-btn";
      speakBtn.textContent = "🔊";
      speakBtn.addEventListener("click", (e) => { e.stopPropagation(); speak(extractMarker(word.en) ? word.en.replace(/\{\{(.*?)\}\}/, "$1") : word.word); });
      card.appendChild(speakBtn);
    }
    card.addEventListener("click", () => { st.flipped = !st.flipped; renderStudy(); });
    wrap.appendChild(card);

    const nav = document.createElement("div");
    nav.className = "study-nav";
    const prevBtn = document.createElement("button");
    prevBtn.className = "nav-icon-btn";
    prevBtn.textContent = "◀";
    prevBtn.disabled = st.idx === 0;
    prevBtn.addEventListener("click", () => { if (st.idx > 0) { st.idx--; st.flipped = false; renderStudy(); } });
    nav.appendChild(prevBtn);

    const nextBtn = document.createElement("button");
    nextBtn.className = "btn-primary";
    const isLast = st.idx === st.words.length - 1;
    nextBtn.textContent = isLast ? "看完啦，开始自测 →" : "下一个";
    nextBtn.addEventListener("click", () => {
      if (isLast) {
        st.phase = "recall";
        st.recallQueue = shuffle(st.words);
        st.recallRevealed = false;
      } else {
        st.idx++;
        st.flipped = false;
      }
      renderStudy();
    });
    nav.appendChild(nextBtn);
    wrap.appendChild(nav);

    app.appendChild(wrap);
  }

  function renderStudyRecall() {
    const st = studyState;
    const wrap = document.createElement("div");
    wrap.className = "study-wrap";

    if (st.recallQueue.length === 0) {
      // finished self-test — mark this day as studied and hand off to the test
      state.studied[st.level.id] = true;
      saveState();
      const doneWrap = document.createElement("div");
      doneWrap.className = "summary-wrap";
      doneWrap.innerHTML =
        '<div class="summary-emoji">📚</div>' +
        '<div class="summary-title">Day ' + st.level.id + ' 单词学完啦！</div>' +
        '<div class="summary-sub">一共学了 ' + st.words.length + ' 个词，自测认对 ' + st.knownCount + ' 次，现在去闯关测试一下吧</div>';
      const actions = document.createElement("div");
      actions.className = "summary-actions";
      const testBtn = document.createElement("button");
      testBtn.className = "btn-primary";
      testBtn.textContent = "开始测试关卡";
      testBtn.addEventListener("click", () => startLesson(st.level));
      actions.appendChild(testBtn);
      const mapBtn = document.createElement("button");
      mapBtn.className = "btn-secondary";
      mapBtn.textContent = "返回关卡地图";
      mapBtn.addEventListener("click", () => go("map"));
      actions.appendChild(mapBtn);
      doneWrap.appendChild(actions);
      app.appendChild(doneWrap);
      return;
    }

    const word = st.recallQueue[0];
    const topbar = document.createElement("div");
    topbar.className = "study-topbar";
    const closeBtn = document.createElement("button");
    closeBtn.className = "close-btn";
    closeBtn.textContent = "✕";
    closeBtn.addEventListener("click", () => go("map"));
    const progress = document.createElement("div");
    progress.className = "study-progress-text";
    progress.textContent = "剩余 " + st.recallQueue.length + " 个 · 已掌握 " + st.knownCount;
    const badge = document.createElement("div");
    badge.className = "study-mode-badge recall";
    badge.textContent = "第二步·自测回忆";
    topbar.appendChild(closeBtn);
    topbar.appendChild(progress);
    topbar.appendChild(badge);
    wrap.appendChild(topbar);

    const card = document.createElement("div");
    card.className = "recall-card";
    if (!st.recallRevealed) {
      card.innerHTML =
        '<div class="study-cn">' + word.cn + '</div>' +
        '<div class="study-pos">' + word.pos + '</div>' +
        '<div class="recall-hint">先别看答案，回忆一下这个词的英文怎么写、怎么读 🤔</div>';
    } else {
      card.innerHTML =
        '<div class="study-word">' + word.word + '</div>' +
        '<div class="study-ipa">/' + word.ipa + '/</div>' +
        '<div class="study-sentence" style="margin-top:12px;">' + renderSentenceHTML(word.en, word.word) + '</div>';
      const speakBtn = document.createElement("button");
      speakBtn.className = "speak-btn";
      speakBtn.textContent = "🔊";
      speakBtn.addEventListener("click", () => speak(word.word));
      card.appendChild(speakBtn);
    }
    wrap.appendChild(card);

    if (!st.recallRevealed) {
      const revealBtn = document.createElement("button");
      revealBtn.className = "btn-primary";
      revealBtn.textContent = "显示答案";
      revealBtn.addEventListener("click", () => { st.recallRevealed = true; renderStudy(); });
      wrap.appendChild(revealBtn);
    } else {
      const markRow = document.createElement("div");
      markRow.className = "recall-mark-row";
      const unknownBtn = document.createElement("button");
      unknownBtn.className = "btn-secondary";
      unknownBtn.textContent = "还没记住";
      unknownBtn.addEventListener("click", () => {
        const missedWord = st.recallQueue.shift();
        const insertAt = Math.min(3 + Math.floor(Math.random() * 3), st.recallQueue.length);
        st.recallQueue.splice(insertAt, 0, missedWord);
        st.recallRevealed = false;
        renderStudy();
      });
      const knownBtn = document.createElement("button");
      knownBtn.className = "btn-primary recall-known-btn";
      knownBtn.textContent = "记住了 ✓";
      knownBtn.addEventListener("click", () => {
        st.recallQueue.shift();
        st.knownCount++;
        st.recallRevealed = false;
        renderStudy();
      });
      markRow.appendChild(unknownBtn);
      markRow.appendChild(knownBtn);
      wrap.appendChild(markRow);
    }

    app.appendChild(wrap);
  }

  function renderStudy() {
    app.innerHTML = "";
    if (studyState.phase === "browse") renderStudyBrowse();
    else renderStudyRecall();
  }

  /* ---------------- LESSON SCREEN ---------------- */
  function makeQuestion(word, pool, forceType) {
    // Weighted so real recall (spelling) is the most common question type —
    // multiple-choice alone let kids clear a level by pattern-guessing
    // without ever producing the word themselves.
    const weightedTypes = ["spell", "spell", "spell", "mc_meaning", "mc_meaning", "mc_word", "listen", "sentence"];
    const type = forceType || weightedTypes[Math.floor(Math.random() * weightedTypes.length)];
    const distractPool = pool.filter(w => w.word !== word.word);

    if (type === "mc_meaning") {
      const opts = shuffle([word.cn].concat(sample(distractPool, 3).map(w => w.cn)));
      return { type, word, options: opts, correct: word.cn };
    }
    if (type === "mc_word" || type === "listen") {
      const opts = shuffle([word.word].concat(sample(distractPool, 3).map(w => w.word)));
      return { type, word, options: opts, correct: word.word };
    }
    if (type === "sentence") {
      const marker = extractMarker(word.en);
      const distractWords = sample(distractPool, 3).map(w => extractMarker(w.en) || w.word);
      const opts = shuffle([marker].concat(distractWords));
      return { type, word, options: opts, correct: marker };
    }
    // spell
    return { type: "spell", word, correct: word.word };
  }

  function startLesson(level) {
    const pool = buildLessonPool(level);
    const questions = pool.map(w => makeQuestion(w, pool));
    lessonState = {
      level, questions, pool, idx: 0, hearts: 5, correctCount: 0,
      misses: [], answered: false, selected: null
    };
    go("lesson");
  }

  function renderLesson() {
    app.innerHTML = "";
    const ls = lessonState;
    const q = ls.questions[ls.idx];

    const wrap = document.createElement("div");
    wrap.className = "lesson-wrap";

    // top bar
    const topbar = document.createElement("div");
    topbar.className = "lesson-topbar";
    const closeBtn = document.createElement("button");
    closeBtn.className = "close-btn";
    closeBtn.textContent = "✕";
    closeBtn.addEventListener("click", () => { if (confirm("确定要退出本关吗？本次进度不会保存")) go("map"); });
    const track = document.createElement("div");
    track.className = "progressbar-track";
    const fill = document.createElement("div");
    fill.className = "progressbar-fill";
    fill.style.width = Math.round((ls.idx / ls.questions.length) * 100) + "%";
    track.appendChild(fill);
    const hearts = document.createElement("div");
    hearts.className = "hearts";
    hearts.textContent = "❤️".repeat(ls.hearts) + "🤍".repeat(5 - ls.hearts);
    topbar.appendChild(closeBtn);
    topbar.appendChild(track);
    topbar.appendChild(hearts);
    wrap.appendChild(topbar);

    const qCard = document.createElement("div");
    qCard.className = "question-card";

    const instr = document.createElement("div");
    instr.className = "q-instruction";
    const instrText = {
      mc_meaning: "选出正确的中文意思",
      mc_word: "选出对应的英文单词",
      listen: "点击喇叭听发音，选出你听到的单词",
      spell: "根据提示拼写出这个单词",
      sentence: "选出正确的单词，补全句子",
    };
    instr.textContent = instrText[q.type];
    qCard.appendChild(instr);

    const prompt = document.createElement("div");
    prompt.className = "q-prompt";

    if (q.type === "mc_meaning") {
      prompt.innerHTML =
        '<div class="word">' + q.word.word + '</div>' +
        '<div class="ipa">/' + q.word.ipa + '/</div>' +
        '<div class="pos">' + q.word.pos + '</div>';
      const sb = document.createElement("button");
      sb.className = "speak-btn"; sb.textContent = "🔊";
      sb.addEventListener("click", () => speak(q.word.word));
      prompt.appendChild(sb);
    } else if (q.type === "mc_word" || q.type === "spell") {
      prompt.innerHTML = '<div class="cn">' + q.word.cn + '</div><div class="pos">' + q.word.pos + '</div>';
      if (q.type === "spell") {
        const ipaLine = document.createElement("div");
        ipaLine.className = "ipa";
        ipaLine.textContent = "/" + q.word.ipa + "/";
        prompt.appendChild(ipaLine);
      }
    } else if (q.type === "listen") {
      prompt.innerHTML = '<div class="pos">🎧 请听发音</div>';
      const sb = document.createElement("button");
      sb.className = "speak-btn"; sb.textContent = "🔊";
      sb.addEventListener("click", () => speak(q.word.word));
      prompt.appendChild(sb);
    } else if (q.type === "sentence") {
      prompt.innerHTML =
        '<div class="sentence">' + renderSentenceHTML(q.word.en) + '</div>' +
        '<div class="sentence-zh">' + q.word.zh + '</div>';
    }
    qCard.appendChild(prompt);

    const bottomArea = document.createElement("div");

    if (q.type === "spell") {
      const row = document.createElement("div");
      row.className = "spell-row";
      const input = document.createElement("input");
      input.className = "spell-input";
      input.setAttribute("autocapitalize", "off");
      input.setAttribute("autocorrect", "off");
      input.setAttribute("spellcheck", "false");
      input.placeholder = "在此输入英文单词";
      const hintBtn = document.createElement("button");
      hintBtn.className = "hint-btn";
      hintBtn.textContent = "提示";
      hintBtn.addEventListener("click", () => {
        input.value = q.word.word[0];
        input.focus();
      });
      row.appendChild(input);
      row.appendChild(hintBtn);
      bottomArea.appendChild(row);

      const checkBtn = document.createElement("button");
      checkBtn.className = "check-btn";
      checkBtn.textContent = "检查";
      input.addEventListener("input", () => {
        checkBtn.classList.toggle("active", input.value.trim().length > 0);
      });
      checkBtn.addEventListener("click", () => {
        if (!input.value.trim() || ls.answered) return;
        const correct = input.value.trim().toLowerCase() === q.correct.toLowerCase();
        input.classList.add(correct ? "correct" : "wrong");
        input.disabled = true;
        submitAnswer(q, correct);
      });
      bottomArea.appendChild(checkBtn);
      qCard.appendChild(bottomArea);
      wrap.appendChild(qCard);
      app.appendChild(wrap);
      setTimeout(() => input.focus(), 50);
    } else {
      const optWrap = document.createElement("div");
      optWrap.className = "options";
      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.addEventListener("click", () => {
          if (ls.answered) return;
          const correct = opt === q.correct;
          ls.answered = true;
          ls.selected = opt;
          [...optWrap.children].forEach(c => {
            c.classList.add("dim");
            if (c.textContent === q.correct) c.classList.remove("dim");
          });
          btn.classList.remove("dim");
          btn.classList.add(correct ? "correct" : "wrong");
          submitAnswer(q, correct);
        });
        optWrap.appendChild(btn);
      });
      qCard.appendChild(optWrap);
      wrap.appendChild(qCard);
      app.appendChild(wrap);
    }
  }

  function submitAnswer(q, correct) {
    const ls = lessonState;
    ls.answered = true;
    if (correct) {
      ls.correctCount++;
    } else {
      ls.hearts--;
      ls.misses.push(q.word);
      // Force this word to reappear later as a spelling question — guessing
      // wrong on a multiple-choice question no longer just costs a heart,
      // it has to be correctly recalled from scratch before the lesson ends.
      if (ls.pool && ls.pool.length) {
        const retryQ = makeQuestion(q.word, ls.pool, "spell");
        const insertOffset = 3 + Math.floor(Math.random() * 4); // 3-6 questions later
        const insertAt = Math.min(ls.idx + insertOffset, ls.questions.length);
        ls.questions.splice(insertAt, 0, retryQ);
      }
    }
    showFeedback(q, correct);
  }

  function showFeedback(q, correct) {
    const bar = document.createElement("div");
    bar.className = "feedback-bar " + (correct ? "correct" : "wrong");
    const text = document.createElement("div");
    text.className = "feedback-text";
    text.textContent = correct ? ["太棒了！", "答对了！", "厉害！", "完美！"][Math.floor(Math.random()*4)] : "不对哦";
    bar.appendChild(text);
    if (!correct) {
      const ans = document.createElement("div");
      ans.className = "feedback-answer";
      const showWord = q.type === "mc_meaning" ? (q.word.word + "  " + q.word.cn) : (q.correct + "  " + q.word.cn);
      ans.textContent = "正确答案：" + showWord;
      bar.appendChild(ans);
    }
    const btn = document.createElement("button");
    btn.className = "btn-primary";
    btn.textContent = lessonState.hearts <= 0 ? "查看结果" : "继续";
    btn.addEventListener("click", nextQuestion);
    bar.appendChild(btn);
    document.querySelector(".lesson-wrap").appendChild(bar);
    setTimeout(() => btn.focus(), 10);
  }

  function nextQuestion() {
    const ls = lessonState;
    if (ls.hearts <= 0) { finishLesson(false); return; }
    ls.idx++;
    ls.answered = false;
    ls.selected = null;
    if (ls.idx >= ls.questions.length) { finishLesson(true); return; }
    renderLesson();
  }

  function finishLesson(completed) {
    const ls = lessonState;
    // Use questions actually answered, not ls.questions.length — that array
    // keeps growing as missed words get requeued, so on an early failure it
    // would include not-yet-seen questions and inflate the denominator.
    const total = ls.correctCount + ls.misses.length;
    const acc = total ? ls.correctCount / total : 0;
    let stars = 0;
    if (completed) {
      if (ls.hearts >= 5) stars = 3;
      else if (ls.hearts >= 3) stars = 2;
      else stars = 1;
    }
    const xpGain = ls.correctCount * 10 + (completed ? 20 : 0);
    state.xp += xpGain;

    if (completed) {
      const prev = state.completed[ls.level.id];
      state.completed[ls.level.id] = { stars: Math.max(stars, prev ? prev.stars : 0) };
      const today = todayStr();
      if (state.lastPlayedDate !== today) {
        // simple consecutive-day check based on date diff
        state.streak = state.streak ? state.streak + 1 : 1;
        state.lastPlayedDate = today;
      }
    }
    saveState();

    lessonState.summary = { completed, total, correctCount: ls.correctCount, stars, xpGain, misses: ls.misses };
    go("summary");
  }

  /* ---------------- SUMMARY SCREEN ---------------- */
  function renderSummary() {
    app.innerHTML = "";
    const s = lessonState.summary;
    const wrap = document.createElement("div");
    wrap.className = "summary-wrap";

    wrap.innerHTML =
      '<div class="summary-emoji">' + (s.completed ? "🎉" : "💔") + '</div>' +
      '<div class="summary-title">' + (s.completed ? "关卡完成！" : "本关失败，再接再厉") + '</div>' +
      '<div class="summary-sub">' + lessonState.level.label + " · " + lessonState.level.sub + '</div>' +
      (s.completed ? '<div class="summary-stars">' + "★".repeat(s.stars) + "☆".repeat(3-s.stars) + '</div>' : '');

    const statsDiv = document.createElement("div");
    statsDiv.className = "summary-stats";
    statsDiv.innerHTML =
      '<div class="summary-stat-card"><div class="num">' + s.correctCount + '/' + s.total + '</div><div class="label">答对题数</div></div>' +
      '<div class="summary-stat-card"><div class="num">+' + s.xpGain + '</div><div class="label">获得经验</div></div>' +
      '<div class="summary-stat-card"><div class="num">' + Math.round(s.correctCount/s.total*100) + '%</div><div class="label">正确率</div></div>';
    wrap.appendChild(statsDiv);

    if (s.misses.length) {
      const missBox = document.createElement("div");
      missBox.className = "miss-list";
      const uniqueMisses = [];
      const seen = new Set();
      s.misses.forEach(w => { if (!seen.has(w.word)) { seen.add(w.word); uniqueMisses.push(w); } });
      missBox.innerHTML = "<h3>本关错词（" + uniqueMisses.length + "个）</h3>" +
        uniqueMisses.map(w => '<div class="miss-item"><span class="w">' + w.word + '</span><span class="c">' + w.cn + '</span></div>').join("");
      wrap.appendChild(missBox);
    }

    const actions = document.createElement("div");
    actions.className = "summary-actions";

    if (s.misses.length) {
      const retryMissBtn = document.createElement("button");
      retryMissBtn.className = "btn-primary";
      retryMissBtn.textContent = "只复习错题";
      retryMissBtn.addEventListener("click", () => {
        const uniqueMisses = [];
        const seen = new Set();
        s.misses.forEach(w => { if (!seen.has(w.word)) { seen.add(w.word); uniqueMisses.push(w); } });
        const distractSource = uniqueMisses.length >= 4 ? uniqueMisses : WORDS_BY_DAY[lessonState.level.type==='learn'?lessonState.level.id:1];
        const questions = uniqueMisses.map(w => makeQuestion(w, distractSource));
        lessonState = { level: lessonState.level, questions, pool: distractSource, idx: 0, hearts: 5, correctCount: 0, misses: [], answered: false, selected: null };
        go("lesson");
      });
      actions.appendChild(retryMissBtn);
    }

    const retryBtn = document.createElement("button");
    retryBtn.className = s.misses.length ? "btn-secondary" : "btn-primary";
    retryBtn.textContent = "重新挑战本关";
    retryBtn.addEventListener("click", () => startLesson(lessonState.level));
    actions.appendChild(retryBtn);

    const mapBtn = document.createElement("button");
    mapBtn.className = "btn-secondary";
    mapBtn.textContent = "返回关卡地图";
    mapBtn.addEventListener("click", () => go("map"));
    actions.appendChild(mapBtn);

    wrap.appendChild(actions);
    app.appendChild(wrap);
  }

  /* ================= render dispatcher ================= */
  function render() {
    if (screen === "map") renderMap();
    else if (screen === "study") renderStudy();
    else if (screen === "lesson") renderLesson();
    else if (screen === "summary") renderSummary();
  }

  render();
})();
</script>
</body>
